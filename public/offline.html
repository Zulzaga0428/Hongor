<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f8a7e" />
    <title>Интернэт тасарсан — Гарц</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f4f6f7;
        color: #1d2a31;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border-top: 3px solid #0f8a7e;
        border-radius: 14px;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
        padding: 32px 24px;
        text-align: center;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 16px 0 6px; }
      p { margin: 0; color: #6a7a84; font-size: 15px; line-height: 1.5; }
      button {
        margin-top: 22px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        background: #0f8a7e;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        padding: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Гарц" />
      <h1>Интернэт тасарсан байна</h1>
      <p>Холболтоо шалгаад дахин оролдоно уу. Таны мэдээлэл аюулгүй хадгалагдсан.</p>
      <button type="button" onclick="location.reload()">Дахин оролдох</button>
    </main>
    <script>
      // Холболт сэргэмэгц өөрөө дахин ачаална
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
